# Enigma AWS resource manifest — ITEMISED PLAN FOR OWNER APPROVAL. NOT APPROVED. NOTHING IN THIS FILE HAS BEEN CREATED.
# Nothing may be created until every field under `approval` is filled by the owner AND a non-root identity exists
# (docs/AWS_ROOT_KEY_REMEDIATION.md). Costs are model estimates (scripts/aws_cost_model.py), not quotes; see docs/AWS_COST_MATRIX.md.
version: 1
approval:
  approved: false                 # the owner flips this deliberately, per resource group, in a reviewed commit
  approved_by: null
  approved_on: null
  region: null                    # NOT approved. us-east-1 was only used for estimates.
  identity: null                  # must be a NON-ROOT IAM Identity Center / role; never root
  dollar_ceiling_usd_per_month: null
  credit_expiry_checked_in_billing_console: null   # the exact date; no API returns it
  free_tier_eligibility_checked: null
  budget_notification_only_not_a_cap: true
compute_boundary:
  aws_gpu: forbidden              # no EC2 GPU, SageMaker, Bedrock, GPU ECS/EKS/Batch, accelerator of any kind
  inference_location: "user-launched Kaggle 2x NVIDIA Tesla T4 only"
resources:
  - { id: cognito_user_pool,   type: "AWS::Cognito::UserPool",        tier: Lite, billing: "free 10k MAU (unverified for this account)",  est_low_mod_high_usd: [0.00, 0.03, 0.14] }
  - { id: api_lambda,          type: "AWS::Lambda::Function",         runtime: python3.13, arch: x86_64, memory_mb: 512,  timeout_s: 15, reserved_concurrency: "none (account limit 10; optional parameter, default 0)" }
  - { id: api_function_url,    type: "AWS::Lambda::Url",              auth: NONE, note: "public at the edge; application auth + limits are the control" }
  - { id: web_lambda,          type: "AWS::Lambda::Function",         runtime: nodejs, arch: "arm64 or x86_64 (package is architecture independent)", memory_mb: 1024, timeout_s: 20, reserved_concurrency: "none (account limit 10; optional parameter, default 0)", package: "Next.js 16 standalone + Lambda Web Adapter layer" }
  - { id: web_function_url,    type: "AWS::Lambda::Url",              auth: NONE }
  - { id: amplify_app_option,  type: "AWS::Amplify::App",          optional: true, status: "AMPLIFY_NEXT16_BLOCKED", note: "ALTERNATIVE to web_lambda; managed SSR documents Next 12-15 only; needs separate approval of build minutes, SSR requests, egress, logs (docs/AWS_AMPLIFY_NEXT16.md). Connecting a branch makes every push a billable build." }
  - { id: cloudfront,          type: "AWS::CloudFront::Distribution", optional: true, note: "decision pending: a raw Function URL is cheaper at list prices; CloudFront only wins if its free tier applies (docs/AWS_COST_MATRIX.md)" }
  - { id: dynamodb_table,      type: "AWS::DynamoDB::Table",         name: enigma-dev, gsi: 0, billing: "PAY_PER_REQUEST or PROVISIONED 25/25", ttl_attribute: ttl, pitr: false }
  - { id: dynamodb_parity_table, type: "AWS::DynamoDB::Table",       name: "enigma-parity-<random>", throwaway: true, billing: "PROVISIONED 25/25 Standard", teardown: "immediately after the real-table parity run" }
  - { id: log_groups,          type: "AWS::Logs::LogGroup",          retention_days: 7, count: 2 }
  - { id: artifact_bucket,     type: "AWS::S3::Bucket",               purpose: "Lambda zips only", block_public_access: true }
  - { id: cloudwatch_dashboard, type: "AWS::CloudWatch::Dashboard",   name: Enigma-Control-Plane, source: infra/aws/dashboards/enigma-control-plane.json, metrics: 30, optional: true, precondition: "scripts/check_dashboard_quota.py reports a free slot" }
  - { id: iam_roles,           type: "AWS::IAM::Role",                note: "api role = logs + DynamoDB table policy + ops-reader policy; web role = logs only" }
forbidden:
  - "AWS::EC2::Instance"
  - "AWS::EC2::NatGateway"
  - "AWS::SageMaker::*"
  - "AWS::Bedrock::*"
  - "AWS::ECS::*"
  - "AWS::EKS::*"
  - "AWS::Batch::*"
  - "AWS::ElasticLoadBalancingV2::*"
  - "AWS::RDS::DBInstance (Track A only after a separate explicit decision)"
  - "AWS::Route53::HostedZone"
  - "AWS::SecretsManager::Secret"
teardown_order: [cloudwatch_dashboard, amplify_app_option, cloudfront, web_function_url, web_lambda, api_function_url, api_lambda, dynamodb_parity_table, dynamodb_table, log_groups, cognito_user_pool, artifact_bucket, iam_roles]
