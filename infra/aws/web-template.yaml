AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Enigma web tier (Next.js 16 standalone behind the AWS Lambda Web Adapter, Path A) - REVIEW DRAFT. NOT DEPLOYED, NOT APPROVED.
  Do not create this stack until the owner has approved region, resource manifest, credit expiry and dollar ceiling (docs/AWS_DEPLOYMENT_READINESS.md).
  Contains no CloudFront, VPC, NAT, ALB, domain, WAF, Secrets Manager or GPU resource. The optional CloudFront+OAC front is a separate, later decision.
  Create the stack WITH stack-level tag Project=enigma, otherwise scripts/aws_teardown.py will (deliberately) not see it.
Parameters:
  Environment: { Type: String, Default: dev, AllowedValues: [dev] }
  CodeBucket: { Type: String, Description: "Existing bucket holding the web zip (not created here)" }
  CodeKey: { Type: String }
  LwaLayerArn: { Type: String, AllowedPattern: "^arn:aws:lambda:[a-z0-9-]+:[0-9]{12}:layer:[A-Za-z0-9_-]+:[0-9]+$", Description: "Lambda Web Adapter layer ARN, ARM64 variant, for this region. Copy the CURRENT value from the official aws-lambda-web-adapter README at deploy time; it is intentionally not hard-coded or guessed here." }
  CognitoRegion: { Type: String, AllowedPattern: "^[a-z]{2}-[a-z]+-[0-9]$" }
  CognitoUserPoolId: { Type: String, AllowedPattern: "^[\\w-]+_[A-Za-z0-9]+$" }
  CognitoAppClientId: { Type: String, AllowedPattern: "^[A-Za-z0-9]{10,64}$" }
  ApiUrl: { Type: String, AllowedPattern: "^https://[A-Za-z0-9.-]+/?$", Description: "Base URL of the API Function URL (the BFF's upstream)" }
  PublicHost: { Type: String, AllowedPattern: "^[A-Za-z0-9.-]*$", Default: "", Description: "Hostname users reach (CSRF check). Empty on first create: the Function URL host is only known after creation, so set it by a stack UPDATE. Never leave empty in production." }
Resources:
  WebLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/enigma-web-${Environment}", RetentionInDays: 7 }
  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }]
      Policies:
        - PolicyName: logs-only   # the web tier needs no AWS API access at all
          PolicyDocument:
            Version: "2012-10-17"
            Statement: [{ Effect: Allow, Action: ["logs:CreateLogStream", "logs:PutLogEvents"], Resource: !GetAtt WebLogs.Arn }]
  WebFunction:
    Type: AWS::Lambda::Function
    DependsOn: WebLogs
    Properties:
      FunctionName: !Sub "enigma-web-${Environment}"
      Runtime: nodejs22.x
      Architectures: [arm64]   # literal on purpose (governance test); LwaLayerArn must be the arm64 variant
      Handler: run.sh                 # a 2-line script in the zip: `exec node server.js` (the adapter starts it and proxies to PORT)
      Layers: [!Ref LwaLayerArn]
      Role: !GetAtt WebRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      MemorySize: 1024
      Timeout: 20
      ReservedConcurrentExecutions: 5 # hard cost/abuse bound
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "3000"
          AWS_LWA_READINESS_CHECK_PATH: /
          PORT: "3000"
          HOSTNAME: 0.0.0.0
          NODE_ENV: production
          ENIGMA_AUTH_PROVIDER: cognito
          NEXT_PUBLIC_COGNITO_REGION: !Ref CognitoRegion
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          NEXT_PUBLIC_COGNITO_CLIENT_ID: !Ref CognitoAppClientId
          ENIGMA_API_URL: !Ref ApiUrl
          ENIGMA_PUBLIC_HOST: !Ref PublicHost
          # Server SECRETS never go here (the web tier holds none). Values above are public identifiers.
      Tags: [{ Key: Project, Value: Enigma }, { Key: Environment, Value: !Ref Environment }]
  WebUrl:
    Type: AWS::Lambda::Url
    Properties: { TargetFunctionArn: !GetAtt WebFunction.Arn, AuthType: NONE }   # public at the edge; Cognito cookies + CSRF + rate limits are the controls
  WebUrlPermission:
    Type: AWS::Lambda::Permission
    Properties: { Action: "lambda:InvokeFunctionUrl", FunctionName: !Ref WebFunction, Principal: "*", FunctionUrlAuthType: NONE }
Outputs:
  WebUrl: { Value: !GetAtt WebUrl.FunctionUrl, Description: "Set ENIGMA_PUBLIC_HOST / ENIGMA_PUBLIC_ORIGIN to this host via a stack update" }
