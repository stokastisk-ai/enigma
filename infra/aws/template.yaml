AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Enigma control-plane API — REVIEW DRAFT. NOT DEPLOYED. Do not create this stack until the owner has approved the cost gate in
  docs/AWS_COST_MATRIX.md. Deliberately contains NO RDS, NAT Gateway, VPC, public IP, ALB, Route 53, Secrets Manager or S3.
  The database connection (ENIGMA_DB_DSN) and the Lambda-to-RDS network path are OPEN DECISIONS and intentionally absent.
Parameters:
  Environment: { Type: String, Default: dev, AllowedValues: [dev] }
  CognitoUserPoolId: { Type: String, AllowedPattern: "^[\\w-]+_[A-Za-z0-9]+$" }
  CognitoAppClientId: { Type: String, AllowedPattern: "^[A-Za-z0-9]{10,64}$" }
  AllowedOrigins: { Type: String, Description: "Exact web origin(s) for the Function URL CORS header only (the API code does not read it); CORS is NOT authentication" }
  CodeBucket: { Type: String, Description: "Existing bucket holding the build artifact (not created here)" }
  CodeKey: { Type: String }
Resources:
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/enigma-api-${Environment}", RetentionInDays: 7 }
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }]
      Policies:
        - PolicyName: logs-only   # least privilege: write to its own log group, nothing else
          PolicyDocument:
            Version: "2012-10-17"
            Statement: [{ Effect: Allow, Action: ["logs:CreateLogStream", "logs:PutLogEvents"], Resource: !GetAtt ApiLogs.Arn }]
  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogs
    Properties:
      FunctionName: !Sub "enigma-api-${Environment}"
      Runtime: python3.13
      Architectures: [x86_64]
      Handler: lambda_handler.handler
      Role: !GetAtt ApiRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      MemorySize: 256
      Timeout: 15                     # short requests only; no workers, no held-open streams
      ReservedConcurrentExecutions: 5 # hard bound on parallel invocations (cost and DB-connection cap)
      Environment:
        Variables:
          ENIGMA_ENV: production
          ENIGMA_STORE: postgres
          ENIGMA_AUTH_PROVIDER: cognito
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_APP_CLIENT_ID: !Ref CognitoAppClientId
          # ENIGMA_DB_DSN: OPEN DECISION (SSM SecureString fetch at init vs. other); never a template default or output.
      Tags: [{ Key: Project, Value: Enigma }, { Key: Environment, Value: !Ref Environment }]
  # Function URL with auth NONE is publicly reachable at the AWS edge regardless of CORS. Every route already requires a verified JWT or
  # hashed runtime token, plus body/rate limits. Review before use; IAM auth is not usable from browsers/Kaggle without SigV4.
  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE
      Cors: { AllowOrigins: !Split [",", !Ref AllowedOrigins], AllowMethods: [GET, POST], AllowHeaders: [authorization, content-type, idempotency-key, x-enigma-instance, x-request-id], MaxAge: 600 }
  ApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties: { Action: "lambda:InvokeFunctionUrl", FunctionName: !Ref ApiFunction, Principal: "*", FunctionUrlAuthType: NONE }
