# Daily data-retention job. Replaces the retired Vercel cron: it calls the API's secret-protected prune endpoint, which deletes expired
# job events and old GPU/vLLM telemetry samples. It wakes the sleeping Railway API for a few seconds a day and costs nothing on GitHub (public repo).
# Needs: repository secret ENIGMA_CRON_SECRET (same value as the API's CRON_SECRET) and repository variable ENIGMA_API_URL (https origin of the API).
# GitHub disables scheduled workflows after 60 days without repository activity; a failed or disabled run is visible in the Actions tab.
name: retention
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: retention
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prune expired telemetry and events
        env:
          API_URL: ${{ vars.ENIGMA_API_URL }}
          CRON_SECRET: ${{ secrets.ENIGMA_CRON_SECRET }}
        run: |
          set -euo pipefail
          case "$API_URL" in https://*) ;; *) echo "ENIGMA_API_URL must be an https URL"; exit 1;; esac
          [ -n "$CRON_SECRET" ] || { echo "ENIGMA_CRON_SECRET is not set"; exit 1; }
          # A sleeping API may answer 502 once while it wakes: retry on any transient failure.
          code=$(curl --silent --show-error --output /tmp/prune.json --write-out '%{http_code}' \
                      --retry 6 --retry-delay 5 --retry-all-errors --max-time 60 \
                      -H "Authorization: Bearer ${CRON_SECRET}" "${API_URL%/}/api/v1/admin/prune")
          echo "prune HTTP ${code}"
          [ "$code" = "200" ] || exit 1
          python3 -c 'import json;d=json.load(open("/tmp/prune.json"));print({k:v for k,v in d.items() if isinstance(v,(int,float))})'
